<!doctype html>
<html lang="en">
  <head>
 <!-- ===================== -->
<!-- FAVICON SETUP (GITHUB PAGES SAFE) -->
<!-- ===================== -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-48x48.png" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<meta charset="utf-8">
<title>Thanks</title>
<style>
  body{margin:0;display:grid;place-items:center;height:100vh;background:#0b0b0b;color:#f5f5f5;font-family:'DM Sans',sans-serif}
  .card{max-width:560px;padding:28px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:#121212;text-align:center}
  a{color:#d4af37;text-decoration:none}

  h1,h2,h3{
  font-family:'Cormorant Garamond',serif;
  font-weight:600;
  letter-spacing:-.01em;
  line-height:1.1;
}


    /* ===== STICKY HEADER ===== */
    header{position:sticky;top:0;z-index:10001;background:transparent;backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.05);}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:20px;}
    .brand{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#f0f0ee;text-decoration:none;}
    nav a{margin-left:28px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:400;opacity:.6;transition:opacity .2s;color:#f0f0ee;text-decoration:none;}
    nav a:hover{opacity:1;}
    nav a.active{opacity:1;color:#ddb96a;}
    .hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;width:36px;height:36px;background:transparent;border:none;cursor:pointer;padding:4px;z-index:10000;}
    .hamburger span{display:block;width:100%;height:1px;background:#c9a84c;transition:transform .4s ease,opacity .4s ease;}
    .hamburger.open span:nth-child(1){transform:translateY(6px) rotate(45deg);}
    .hamburger.open span:nth-child(2){opacity:0;}
    .hamburger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
    .menuOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9998;opacity:0;transition:opacity .4s ease;pointer-events:none;}
    .menuOverlay.open{opacity:1;pointer-events:auto;}
    .mobileMenu{position:fixed;top:0;right:0;bottom:0;width:75vw;max-width:320px;background:#141414;border-left:1px solid rgba(201,168,76,.15);z-index:9999;display:flex;flex-direction:column;justify-content:center;padding:60px 40px;transform:translateX(100%);transition:transform .5s cubic-bezier(.16,1,.3,1);pointer-events:none;}
    .mobileMenu.open{transform:translateX(0);pointer-events:auto;}
    .mobileMenu a{font-size:13px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:#f0f0ee;opacity:.5;padding:20px 0;border-bottom:1px solid rgba(255,255,255,.06);transition:opacity .2s;display:block;text-decoration:none;}
    .mobileMenu a:hover{opacity:1;}
    .mobileMenu a.active{opacity:1;color:#ddb96a;}
    @media(max-width:820px){.hamburger{display:flex;}nav{display:none;}.menuOverlay{display:block;}}
  </style>
</head>
<div class="card">
  <h1>Thanks! Your request was sent.</h1>
  <p>We’ll get back to you shortly.</p>
  <p><a href="./index.html">← Back to home</a></p>
</div>
</html>
